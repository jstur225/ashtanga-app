# Nginx反向代理配置 - 有赞Webhook服务
# 将此配置添加到 /etc/nginx/sites-available/youzan-webhook
# 然后创建软链接: ln -s /etc/nginx/sites-available/youzan-webhook /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com;  # 替换为你的域名

    # 日志配置
    access_log /var/log/nginx/youzan-webhook-access.log;
    error_log /var/log/nginx/youzan-webhook-error.log;

    # 健康检查（可选）
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhook端点
    location /webhook/youzan {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 有赞推送可能需要较长时间
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        # 允许大请求体
        client_max_body_size 10M;
    }

    # 其他请求
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS配置（推荐）
# 使用certbot自动配置SSL:
# sudo apt install certbot python3-certbot-nginx
# sudo certbot --nginx -d your-domain.com
